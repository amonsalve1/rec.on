# TLS terminator for the recon api.
#
# Install as /etc/nginx/sites-available/recon and symlink into
# sites-enabled. Replace api.recon.example with the real domain everywhere
# (deploy/README.md walks through the whole sequence).
#
# The api container binds 127.0.0.1:5000 on purpose — nothing but this
# proxy can reach it, and nothing reaches it over plain http.

server {
    listen 80;
    listen [::]:80;
    server_name api.recon.example;

    # certbot's http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.recon.example;

    ssl_certificate     /etc/letsencrypt/live/api.recon.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.recon.example/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # the api sends json only; cap bodies well above any legitimate payload
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;   # gunicorn worker timeout is 30s
    }
}
